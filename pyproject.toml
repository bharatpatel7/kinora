[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinora"
version = "0.1.0"
description = "Open-source, self-hosted prompt-to-video web app."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.4",
    "imageio>=2.35",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Run open-weights models on your own machine (Apple silicon MPS or NVIDIA CUDA).
local = [
    "torch>=2.4",
    "diffusers>=0.32",
    "transformers>=4.46",
    "accelerate>=1.0",
    "sentencepiece",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kinora = "kinora.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["kinora"]

[tool.ruff]
line-length = 110
